<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>✈ 大阪</title>
    <style>
        /* 全域設定與明亮可愛配色 (米白底) */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdfbf7;
            color: #5c5c5c;
        }

        /* 標題橫幅設計 (單一圖片) */
        .header-banner {
            max-width: 92%;
            margin: 20px auto 15px; 
            display: flex;
            justify-content: center;
        }
        
        .header-banner img {
            width: 100%;
            height: 200px;
            object-fit: cover; 
            object-position: center 85%;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* 導覽列 (分頁標籤) */
        .tabs {
            display: flex;
            justify-content: space-around;
            background-color: #ffffff;
            padding: 10px;
            position: sticky;
            top: 0;
            border-bottom: 2px solid #fff5ba;
            z-index: 100;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 0;
            margin: 0 5px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            background-color: #ffffff;
            color: #5c5c5c;
            border-radius: 12px;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: #fff5ba;
        }

        /* 內容區塊 */
        .content {
            display: none;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .content.active {
            display: block;
        }

        /* 卡片風格 */
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 2px solid #fff5ba;
        }

        .card h2 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px; 
            border-bottom: 3px solid #fff5ba;
            padding-bottom: 10px;
        }

        /* 大標題專用收合設定 */
        .card h2.toggle-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            margin-bottom: 0; 
        }
        .card h2.toggle-header.active {
            margin-bottom: 15px; 
        }
        .card h2.toggle-header::after {
            content: '▼';
            font-size: 14px;
            color: #4a779e;
            transition: transform 0.3s ease;
        }
        .card h2.toggle-header.active::after {
            transform: rotate(180deg);
        }

        /* 共用收合區塊設定 */
        .toggle-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .toggle-header.active + .toggle-content {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 航班展示區塊 */
        .flight-item {
            margin-bottom: 15px;
            border-bottom: 1px dashed #e0e0e0;
            padding-bottom: 15px;
        }
        .flight-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        /* 名字按鈕 (藍色膠囊) */
        .flight-item h3.toggle-header {
            background-color: #7ab0d6;
            color: #ffffff;
            padding: 5px 15px;
            border-radius: 20px;
            margin: 0;
            font-size: 18px;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .flight-item h3.toggle-header::after {
            content: '▼';
            font-size: 12px;
            margin-left: 8px;
            transition: transform 0.3s ease;
        }
        .flight-item h3.toggle-header.active::after {
            transform: rotate(180deg);
        }

        .flight-info {
            background-color: #fdfbf7;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 16px;
            line-height: 1.6;
            margin-top: 10px;
        }
        .flight-info strong {
            color: #4a779e;
        }

        /* 住宿展示區塊專用設計 */
        .hotel-section {
            margin-bottom: 20px;
        }
        .hotel-section:last-child {
            margin-bottom: 0;
        }
        
        /* 住宿分組按鈕 (藍色長膠囊) */
        .hotel-badge.toggle-header {
            background-color: #7ab0d6;
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 0;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .hotel-badge.toggle-header::after {
            content: '▼';
            font-size: 12px;
            margin-left: 8px;
            transition: transform 0.3s ease;
        }
        .hotel-badge.toggle-header.active::after {
            transform: rotate(180deg);
        }

        .hotel-details {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background-color: #ffffff;
            font-size: 16px;
            line-height: 1.7;
            margin-top: 12px;
        }
        .hotel-blue-text {
            color: #4a779e;
            font-weight: bold;
        }

        /* 行程展示區塊 (黃色長條按鈕) */
        .schedule-day {
            margin-bottom: 15px;
        }
        .schedule-day h3.toggle-header {
            background-color: #fff5ba;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 0;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .schedule-day h3.toggle-header::after {
            content: '▼';
            font-size: 14px;
            color: #4a779e;
            transition: transform 0.3s ease;
        }
        .schedule-day h3.toggle-header.active::after {
            transform: rotate(180deg);
        }

        .schedule-info {
            background-color: #fdfbf7;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 16px;
            line-height: 1.6;
            min-height: 40px;
            margin-top: 10px;
        }

        /* 地鐵圖區塊 */
        .map-container {
            width: 100%;
            height: 40vh;
            border: 2px solid #7ab0d6;
            border-radius: 12px;
            overflow: auto;
            margin-bottom: 15px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .map-container img {
            width: 100%;
            height: auto;
            min-width: 600px;
        }
        .map-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #7ab0d6;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            box-sizing: border-box;
        }

        /* 匯率與清單 */
        .exchange-rate {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .exchange-rate input {
            width: 45%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #7ab0d6;
            border-radius: 12px;
            text-align: center;
            box-sizing: border-box;
        }
        .list-input-group {
            display: flex;
            margin-bottom: 15px;
        }
        .list-input-group input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px 0 0 8px;
            outline: none;
        }
        .btn-add {
            background-color: #7ab0d6;
            color: #ffffff;
            border: none;
            padding: 0 20px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 18px;
        }
        .item-checkbox {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #7ab0d6;
        }
        .item-text {
            flex: 1;
            transition: color 0.3s, text-decoration 0.3s;
        }
        .item-checkbox:checked + .item-text {
            text-decoration: line-through;
            color: #d3d3d3;
        }
        .btn-remove {
            background-color: #ffd1dc;
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            margin-left: 10px;
        }
    </style>
</head>

    <div class="header-banner">
        <img src="A1.jpg" alt="大阪">
    </div>
